[build-system]
requires = ["setuptools>=68", "wheel", "numpy", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "sentalign"
version = "0.2.1"
description = "In-memory sentence alignment with Vecalign dynamic programming"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
  {name = "Abdulrahman Almajdalawi"}
]
dependencies = [
  "numpy",
]

[project.optional-dependencies]
test = [
  "pytest>=7"
]
test-real = [
  "pytest>=7",
  "sentence-transformers>=2.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentalign = ["*.pyx"]
