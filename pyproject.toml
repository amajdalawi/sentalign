[build-system]
requires = ["setuptools>=68", "wheel", "numpy", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "sentweave"
version = "0.3.1"
description = "In-memory sentence alignment with Vecalign dynamic programming"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
  {name = "Abdulrahman Almajdalawi"}
]
dependencies = [
  "numpy",
]

[project.urls]
Homepage = "https://github.com/amajdalawi/sentweave"
Repository = "https://github.com/amajdalawi/sentweave"
Issues = "https://github.com/amajdalawi/sentweave/issues"

[project.optional-dependencies]
test = [
  "pytest>=7"
]
test-real = [
  "pytest>=7",
  "sentence-transformers>=2.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentweave = ["*.pyx"]
